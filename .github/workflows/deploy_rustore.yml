name: Deploy to RuStore

on:
  push:
    tags:
      - 'v*' # Запускать при создании тегов вида v1.0.0, v1.0.1 и т.д.
  workflow_dispatch: # Возможность ручного запуска из интерфейса GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.ENCODED_KEYSTORE }}" | base64 --decode > app/keystore.jks

      # --dart-define-* обязательны: без них в релизе пустые client id
      # и синхронизация с Google Drive не работает.
      - name: Build Release Bundle (AAB)
        env:
          KEYSTORE_FILE_PATH: "keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
          IOS_CLIENT_ID: ${{ secrets.IOS_CLIENT_ID }}
        run: |
          flutter build appbundle --release \
            --dart-define=WEB_CLIENT_ID="$WEB_CLIENT_ID" \
            --dart-define=IOS_CLIENT_ID="$IOS_CLIENT_ID"

      - name: Publish to RuStore
        env:
          RUSTORE_CLIENT_ID: ${{ secrets.RUSTORE_CLIENT_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
        run: ./gradlew :app:publishToRuStore
