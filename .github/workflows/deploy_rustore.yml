name: Deploy to RuStore

on:
  push:
    tags:
      - 'v*' # Запускать при создании тегов видов v1.0.0, v1.0.1 и т.д.
  workflow_dispatch: # Возможность ручного запуска из интерфейса GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
            java-version: '17'
            distribution: 'temurin'
            cache: 'gradle'

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.ENCODED_KEYSTORE }}" | base64 --decode > app/keystore.jks

      - name: Build Release Bundle (AAB)
        env:
          KEYSTORE_FILE_PATH: "keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Publish to RuStore
        env:
          RUSTORE_CLIENT_ID: ${{ secrets.RUSTORE_CLIENT_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
        run: ./gradlew :app:publishToRuStore