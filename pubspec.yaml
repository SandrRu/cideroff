name: cider_off
description: "CiderOff - Делаем Сидр."
publish_to: 'none'
version: 1.0.4+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # База данных и состояние
  provider: ^6.1.2
  path_provider: ^2.1.5

  # Генерация PDF и печать этикеток
  pdf: ^3.13.0
  printing: ^5.15.0

  # Пуш уведомления и работа со временем
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Импорт/Экспорт, работа с файлами
  share_plus: ^13.3.0
  file_picker: ^12.1.3
  uuid: ^4.5.1
  intl: ^0.20.2
  
  # Построение наглядных графиков
  fl_chart: ^1.2.0
  
  # База данных SQLite
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.4.2+1
  sqlite3: ^3.5.2
  path: ^1.9.0

  # Google Drive
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  
  # Ассеты для дефолтных рецептов и макетов
  assets:
    - assets/default_recipes/
    - assets/default_templates/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/images/icon.png"
    icon_size: 256