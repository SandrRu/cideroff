<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Градиент жидкости внутри яблока -->
    <linearGradient id="ciderGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C245" />
      <stop offset="100%" stop-color="#D48115" />
    </linearGradient>

    <!-- Маска: нижняя половина яблока для заливки жидкостью -->
    <mask id="liquidMask">
      <rect x="0" y="0" width="800" height="300" fill="white" />
      <!-- Обрезаем всё, что выше уровня жидкости (y = 120) -->
      <rect x="0" y="0" width="800" height="120" fill="black" />
    </mask>

    <!-- Общий путь геометричного яблока -->
    <path id="appleOutline" d="M 110,60 C 125,60 140,72 140,72 C 140,72 155,60 170,60 C 198,60 220,82 220,112 C 220,165 140,210 140,210 C 140,210 60,165 60,112 C 60,82 82,60 110,60 Z" />
  </defs>

  <!-- ЗНАК ЛОГОТИПА -->
  <g id="logo-icon">
    <!-- Листочек и черешок -->
    <path d="M 140,60 Q 140,40 148,32" stroke="#2C2621" stroke-width="5" stroke-linecap="round" fill="none" />
    <path d="M 143,45 C 155,40 165,42 168,48 C 160,58 148,52 143,45 Z" fill="#D48115" />

    <!-- Заливка нижней части (жидкость) -->
    <use href="#appleOutline" fill="url(#ciderGradient)" mask="url(#liquidMask)" />

    <!-- Контур яблока -->
    <use href="#appleOutline" fill="none" stroke="#2C2621" stroke-width="6" stroke-linejoin="round" />

    <!-- Уровень жидкости (горизонтальная линия) -->
    <line x1="68" y1="120" x2="212" y2="120" stroke="#2C2621" stroke-width="4" />

    <!-- Насечки ареометра -->
    <line x1="140" y1="108" x2="140" y2="132" stroke="#2C2621" stroke-width="3" />
    <line x1="140" y1="112" x2="152" y2="112" stroke="#2C2621" stroke-width="3" />
    <line x1="140" y1="120" x2="156" y2="120" stroke="#2C2621" stroke-width="4" />
    <line x1="140" y1="128" x2="152" y2="128" stroke="#2C2621" stroke-width="3" />
  </g>

  <!-- ТЕКСТОВАЯ ЧАСТЬ -->
  <g id="logo-text" transform="translate(260, 150)">
    <!-- Текст Cider -->
    <text x="0" y="0" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="72" fill="#2C2621" letter-spacing="-1">Cider</text>
    
    <!-- Текст ff (со смещением под приподнятую O) -->
    <text x="250" y="0" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="72" fill="#2C2621" letter-spacing="-1">ff</text>

    <!-- Приподнятая буква O с пузырьком CO2 -->
    <g transform="translate(180, -32)">
      <!-- Внешний контур O -->
      <circle cx="30" cy="10" r="24" fill="none" stroke="#2C2621" stroke-width="15" />
      <!-- Пузырек CO2 внутри O -->
      <circle cx="30" cy="10" r="6" fill="#D48115" />
    </g>
  </g>
</svg>
